<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOLF KEY PANEL</title>
<style>
* { box-sizing:border-box; }
body {
  background:#090710;
  color:white;
  font-family:Arial,sans-serif;
  padding:25px;
}
h1 { color:#a855f7;text-align:center; }
.card {
  background:#171222;
  border:1px solid #7025a8;
  border-radius:14px;
  padding:20px;
  margin-top:25px;
}
input,button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:8px;
  border:0;
}
button {
  background:#822bd1;
  color:white;
  font-weight:bold;
}
</style>
</head>
<body>
<h1>🐺 WOLF MODS</h1>
<p style="text-align:center">KEY PANEL</p>

<div class="card">
<h2>Acesso administrativo</h2>
<input type="password" placeholder="Senha administrativa">
<button>ENTRAR</button>
</div>

<div class="card">
<h2>Gerenciamento de Keys</h2>
<p>Área administrativa em desenvolvimento.</p>
</div>
</body>
</html>
